<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101c3b">
    <title>{% block title %}Boutique{% endblock %} · ShopDesk</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <a class="brand" href="{{ url_for('show_products') }}">Shop<span>Desk.</span></a>
        <nav aria-label="Navigation principale">
            <ul>
                <li><a href="{{ url_for('show_products') }}">Produits</a></li>
                <li><a href="{{ url_for('show_order_form') }}">Créer une commande</a></li>
                <li><a href="{{ url_for('show_check_order_form') }}">Suivi client</a></li>
                <li><a href="{{ url_for('show_history') }}">Historique</a></li>
            </ul>
        </nav>
    </div>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer class="footer">ShopDesk · Interface de gestion des commandes</footer>
</body>
</html>
